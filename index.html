    <!-- Color mode script (prevents flash): applies the `.dark` class pre-paint.
         Reads the `theme` key (migrates from the legacy Chakra key); visitors
         without a stored choice follow the OS prefers-color-scheme. MUST stay
         logic-identical with readInitialMode() in providers/theme.tsx. Runs in
         <head>, so document.body does not exist yet — only touch documentElement. -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme') || localStorage.getItem('chakra-ui-color-mode');
        var color = stored === 'light' ? 'light' : stored === 'dark' ? 'dark'
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', color === 'dark');
      })();
    </script>
